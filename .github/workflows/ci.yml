name: CI

# Chạy khi mở/cập nhật Pull Request nhắm vào main hoặc dev,
# và khi push lên main/dev.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Quá 15 phút thì tự dừng. Không có dòng này, một test bị treo sẽ giữ máy CI
    # tới 6 tiếng rồi mới bị GitHub hủy.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Máy CI không có màn hình, nên test giao diện JavaFX (AuctionAppTest) bị
      # treo khi mở cửa sổ. xvfb-run tạo một màn hình ảo cho lệnh chạy bên trong.
      - name: Build and test with Maven
        run: xvfb-run -a mvn -B verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
